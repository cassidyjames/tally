name: Mirror
on:
  push:
    branches:
      - 'main'
  release:
    types: [published]
  workflow_dispatch:
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Releases check out a tag; mirroring needs a local default branch
          ref: ${{ github.event.repository.default_branch }}
      
      - name: GitLab
        uses: roostorg/mirror@main
        with:
          destination: https://gitlab.com/cassidyjames/tally.git
          token: ${{ secrets.GITLAB_TOKEN }}

      - name: Codeberg
        uses: roostorg/mirror@main
        with:
          destination: https://codeberg.org/cassidyjames/tally.git
          token: ${{ secrets.CODEBERG_TOKEN }}
          token_username: cassidyjames

      - name: Tangled
        uses: roostorg/mirror@main
        with:
          destination: git@tangled.org:cassidyjames.com/tally
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh_known_hosts: ${{ secrets.TANGLED_KNOWN_HOSTS }}
